name: CI

# Один workflow на всё: проверка веток-предложений, сборка пакета и выпуск версии.
#
# Push в `main` выпускает версию сам: поднимает patch, собирает .apk и публикует
# релиз с тегом. Не запускать прогон вовсе можно строкой `[skip ci]` в сообщении
# коммита, её понимает сам GitHub; правки одной документации не запускают ничего и
# без пометок. `minor` и `major` — Actions → CI → Run workflow.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      bump:
        description: Как повысить версию перед выпуском.
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# По умолчанию токену дано только чтение; задачи поднимают права себе сами.
permissions:
  contents: read

# Ветку-предложение дописывают на ходу, и старый прогон уже никому не нужен.
# Выпуск дорабатывает до конца, а прогоны main выстраиваются в очередь: второй
# должен увидеть коммит выпуска от первого.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Ветка OpenWrt, под которую пишется пакет. Всё остальное берётся из неё, своих версий
  # и патчей здесь нет: ucode — ревизия и патчи пакета ucode, xray — версия пакета
  # xray-core, SDK — сборка этой ветки, jsmin — из LuCI этой ветки. Обновит OpenWrt
  # пакеты — CI подхватит их сам.
  OPENWRT: openwrt-25.12
  # SDK под архитектуру OpenWrt One. Пакет noarch, но собирать его в SDK целевой
  # системы — значит проверить заодно, что его зависимости там существуют.
  SDK_TARGET: aarch64_cortex-a53

jobs:
  # Тесты разбора ссылок, генерации конфигов и правил, смоук плагина rpcd, сквозной
  # сценарий CLI и синтаксис веб-части.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ucode собирается так же, как в OpenWrt: ревизия и патчи — из пакета ucode ветки.
      # Свежий ucode прощает то, на чём роутерный падает (например, `export function`
      # без `;`), и тесты на нём пропустили бы ошибку, которая всплыла бы только на железе.
      - name: ucode package
        run: |
          set -e
          git clone -q --depth 1 --filter=blob:none --sparse -b "$OPENWRT" https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt sparse-checkout set package/utils/ucode
          grep -E '^PKG_(SOURCE_VERSION|RELEASE):=' openwrt/package/utils/ucode/Makefile
          ls openwrt/package/utils/ucode/patches 2>/dev/null || true

      - name: ucode cache
        id: ucode-cache
        uses: actions/cache@v6
        with:
          path: ucode/build
          key: ucode-zlib-${{ hashFiles('openwrt/package/utils/ucode/**') }}-${{ runner.os }}

      # Модули, которых нет в роутерной сборке по умолчанию или которые не нужны
      # тестам (ubus, uci, uloop…), выключены: uci заменяет заглушка tests/mock. zlib нужен:
      # им распаковываются наборы geosite и geoip (.srs).
      - name: build ucode
        if: steps.ucode-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libjson-c-dev zlib1g-dev
          pkg="$PWD/openwrt/package/utils/ucode"
          rev="$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$pkg/Makefile")"
          test -n "$rev"
          git clone -q https://github.com/jow-/ucode.git ucode
          git -C ucode checkout -q "$rev"
          for p in "$pkg"/patches/*.patch; do
            [ -e "$p" ] || continue
            git -C ucode apply "$p"
          done
          cmake -S ucode -B ucode/build -DCMAKE_BUILD_RPATH='$ORIGIN' -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DDEBUG_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DDIGEST_SUPPORT=OFF \
            -DLOG_SUPPORT=OFF -DSOCKET_SUPPORT=OFF -DZLIB_SUPPORT=ON >/dev/null
          cmake --build ucode/build -j"$(nproc)"

      # Из кэша приезжает только сборка, а библиотека json-c нужна и ей. В образе раннера она
      # обычно уже есть — тогда без apt: зеркало Ubuntu однажды повесило задачу до таймаута.
      - name: runtime deps
        if: steps.ucode-cache.outputs.cache-hit == 'true'
        run: ldconfig -p | grep -q 'libjson-c\.so\.5 ' || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libjson-c5; }

      # xray — та же версия, что в пакете xray-core ветки: тесты прогоняют каждый
      # сгенерированный конфиг через `xray run -test`.
      - name: xray
        run: |
          set -e
          v="$(curl -fsSL "https://raw.githubusercontent.com/openwrt/packages/$OPENWRT/net/xray-core/Makefile" | sed -n 's/^PKG_VERSION:=//p')"
          test -n "$v"
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v$v/Xray-linux-64.zip"
          sudo unzip -o -q /tmp/xray.zip xray -d /usr/local/bin
          xray version | head -1

      - run: UCODE="$PWD/ucode/build/ucode" tests/run.sh
      - run: UCODE="$PWD/ucode/build/ucode" tests/cli.sh
      # jsmin из LuCI ветки: он же сжимает виды при сборке пакета.
      - name: web
        run: |
          set -e
          curl -fsSL -o /tmp/jsmin.c "https://raw.githubusercontent.com/openwrt/luci/$OPENWRT/modules/luci-base/src/jsmin.c"
          cc -O2 -o /tmp/jsmin /tmp/jsmin.c
          JSMIN=/tmp/jsmin scripts/check_web.sh

  # Пакет .apk из SDK. В предложении это проверка сборки, в main — то, что уедет
  # в релиз. Версия поднимается ДО сборки: пакет должен называться той версией,
  # под которой выйдет, а коммит с ней делает `release`, когда собрано всё.
  # Идёт параллельно с check: выпуск всё равно ждёт обе задачи.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.head.outputs.sha }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      # На main берём вершину ветки, а не коммит события: прогоны стоят в очереди,
      # и коммит выпуска от предыдущего уже должен быть под нами.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - if: env.PUBLISH == 'true'
        id: bump
        run: |
          set -e
          tag="$(python3 scripts/release.py bump --part '${{ inputs.bump || 'patch' }}' | sed -n 's/.*-> \(v[0-9][0-9.]*\)$/\1/p')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - id: sdk-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Подготовленный SDK (распакованный архив, фиды без .git и собранные хост-инструменты
      # luci-base: jsmin, po2lmo, lua) кэшируется на неделю — на повторных прогонах сборка
      # пакета занимает секунды вместо 6+ минут.
      - name: sdk cache
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: sdk
          key: openwrt-sdk-v1-${{ env.SDK_TARGET }}-${{ env.OPENWRT }}-${{ steps.sdk-week.outputs.week }}

      # SDK ищет пакеты в подкаталогах фида, а у нас пакет — корень репозитория.
      # Поэтому фид собирается рядом: каталог с Makefile, root/ и htdocs/.
      #
      # Все runtime-зависимости, не нужные для сборки noarch-пакета, — пустые заглушки с теми же
      # именами: в .apk попадают только имена зависимостей, а их наличие в настоящих фидах
      # OpenWrt проверяется отдельно. Из настоящего фида luci ставится только luci-base (его
      # хост-инструмент jsmin сжимает JS-виды при упаковке).
      - name: build .apk
        env:
          SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: |
          set -e
          mkdir -p feed/luci-app-stella out sdk
          cp -r Makefile root htdocs feed/luci-app-stella/
          for p in xray-core curl kmod-nft-tproxy kmod-nft-queue ip-full \
                   ucode ucode-mod-fs ucode-mod-uci ucode-mod-zlib \
                   ucode-mod-log ucode-mod-ubus ucode-mod-math; do
            mkdir -p "feed/$p"
            printf '%s\n' \
              'include $(TOPDIR)/rules.mk' \
              "PKG_NAME:=$p" 'PKG_VERSION:=0' 'PKG_RELEASE:=1' \
              'include $(INCLUDE_DIR)/package.mk' \
              "define Package/$p" '  TITLE:=stub' 'endef' \
              'define Build/Compile' 'endef' \
              "define Package/$p/install" '	$(INSTALL_DIR) $(1)/usr' 'endef' \
              "\$(eval \$(call BuildPackage,$p))" > "feed/$p/Makefile"
          done
          # Контейнер SDK работает не от root: исходникам нужно чтение, каталогу out —
          # запись. Права исходников попадают в пакет как есть, а файл, открытый на
          # запись всем, rpcd не загружает («world writable») — и это ещё и дыра.
          chmod -R a+rX feed
          chmod a+rwx out
          IMG="ghcr.io/openwrt/sdk:$SDK_TARGET-$OPENWRT"
          SDK_UID="$(docker run --rm --entrypoint id "$IMG" -u)"
          SDK_GID="$(docker run --rm --entrypoint id "$IMG" -g)"
          sudo chown -R "$SDK_UID:$SDK_GID" sdk
          # SDK (~250 МБ) образ докачивает сам (setup.sh, wget) — берём с downloads.openwrt.org
          # (CDN, с проверкой подписи и контрольной суммы). На повторных прогонах /sdk уже готов
          # из кэша, а отключение CONFIG_ALL_KMODS убирает сборку сотен лишних kmod-*.
          docker run --rm -e UPSTREAM_URL=https://downloads.openwrt.org \
            -e SDK_CACHE_HIT="$SDK_CACHE_HIT" \
            -v "$PWD/feed:/feed:ro" -v "$PWD/out:/out" -v "$PWD/sdk:/sdk" "$IMG" bash -ec '
            cd /sdk
            if [ ! -x ./scripts/feeds ]; then
              printf "%s\n" "read_timeout = 60" "tries = 10" "waitretry = 10" "retry_connrefused = on" > ~/.wgetrc
              /builder/setup.sh
              ./scripts/feeds update base packages luci >/dev/null
              ./scripts/feeds install luci-base >/dev/null
              rm -rf package/feeds/base/ucode
            fi
            for p in xray-core curl; do
              ./scripts/feeds list -r packages | sed "s/[[:space:]].*//" | grep -qx "$p" || { echo "в фиде packages нет $p"; exit 1; }
            done
            for p in ucode ucode-mod-fs ucode-mod-uci ucode-mod-zlib; do
              ./scripts/feeds list -r base | sed "s/[[:space:]].*//" | grep -qx "$p" || { echo "в фиде base нет $p"; exit 1; }
            done
            grep -qxF "src-link stella /feed" feeds.conf.default || echo "src-link stella /feed" >> feeds.conf.default
            ./scripts/feeds update stella >/dev/null
            ./scripts/feeds install -f -p stella xray-core curl kmod-nft-tproxy kmod-nft-queue ip-full \
              ucode ucode-mod-fs ucode-mod-uci ucode-mod-zlib \
              ucode-mod-log ucode-mod-ubus ucode-mod-math luci-app-stella >/dev/null
            printf "%s\n" \
              "# CONFIG_ALL is not set" \
              "# CONFIG_ALL_KMODS is not set" \
              "# CONFIG_ALL_NONSHARED is not set" \
              "CONFIG_PACKAGE_luci-base=m" \
              "CONFIG_LUCI_JSMIN=y" \
              "# CONFIG_LUCI_CSSTIDY is not set" \
              "# CONFIG_LUCI_SRCDIET is not set" \
              "CONFIG_PACKAGE_luci-app-stella=m" > .config
            make defconfig >/dev/null
            grep -qx "CONFIG_LUCI_JSMIN=y" .config || { echo "CONFIG_LUCI_JSMIN не включён"; exit 1; }
            make package/luci-app-stella/compile -j"$(nproc)" V=s
            bad="$(find build_dir -path "*/ipkg-all/luci-app-stella/*" -perm -0002 ! -type l)"
            [ -z "$bad" ] || { echo "в пакете файлы с записью для всех:"; echo "$bad"; exit 1; }
            find bin -name "luci-app-stella*.apk" -exec cp {} /out/ \;
            if [ "$SDK_CACHE_HIT" != "true" ]; then
              rm -rf feeds/*/.git dl bin tmp build_dir/target-* feeds/stella feeds/stella.* package/feeds/stella .config .config.old
            fi
          '
          if [ "$SDK_CACHE_HIT" != "true" ]; then
            sudo chown -R "$(id -u):$(id -g)" sdk
          fi
          ls -la out
          test -n "$(ls out/*.apk)"

      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-stella
          path: out/*.apk
          if-no-files-found: error
          retention-days: ${{ env.PUBLISH == 'true' && 1 || 7 }}

  release:
    name: release
    needs: [check, package]
    if: needs.package.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: luci-app-stella
          path: dist

      # Пакет собран — теперь версию можно закреплять в истории. Коммит и тег уходят
      # под токеном GitHub Actions, а его push не запускает workflow заново — иначе
      # выпуск выпускал бы сам себя по кругу. Если за время сборки в main что-то
      # приехало, push упрётся в разошедшиеся истории и задача упадёт — это лучше,
      # чем тег на дереве, которого никто не собирал.
      - run: |
          set -e
          got="$(python3 scripts/release.py bump --part '${{ inputs.bump || 'patch' }}' | sed -n 's/.*-> \(v[0-9][0-9.]*\)$/\1/p')"
          test "$got" = "$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile
          git commit -m "chore(release): $TAG"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin HEAD:main "$TAG"

      # Публикуем сразу, без черновика; список изменений GitHub соберёт по коммитам.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: dist/*.apk
